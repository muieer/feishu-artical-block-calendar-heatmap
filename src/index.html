<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日历热力图</title>
</head>

<body>
  <main class="heatmap-card">
    <div class="header">
      <h1>日历热力图</h1>
      <span id="date-range" class="note"></span>
    </div>
    <div class="chart-toolbar">
      <span id="visible-range" class="note"></span>
      <nav id="pagination" class="pagination" aria-label="热力图历史分页" hidden>
        <button id="older-page" type="button" aria-controls="heatmap">更早</button>
        <span id="page-number" class="note" aria-live="polite" aria-atomic="true"></span>
        <button id="newer-page" type="button" aria-controls="heatmap">更新</button>
      </nav>
    </div>
    <div class="chart-scroll">
      <div class="chart">
        <div id="months" class="months" aria-hidden="true"></div>
        <div class="calendar">
          <div class="weekdays" aria-hidden="true">
            <span></span><span>一</span><span></span><span>三</span>
            <span></span><span>五</span><span></span>
          </div>
          <div id="heatmap" class="grid" role="img"
            aria-label="正在读取编辑活跃度"></div>
        </div>
      </div>
    </div>
    <div class="legend" aria-label="活动等级从少到多">
      <span>少</span>
      <span class="cell level-0" aria-hidden="true"></span>
      <span class="cell level-1" aria-hidden="true"></span>
      <span class="cell level-2" aria-hidden="true"></span>
      <span class="cell level-3" aria-hidden="true"></span>
      <span class="cell level-4" aria-hidden="true"></span>
      <span>多</span>
    </div>
    <p class="explanation">每格代表一天，颜色表示贡献次数；蓝色轮廓表示今天尚未结算。</p>
    <details class="debug" aria-labelledby="debug-title">
      <summary id="debug-title">开发验证</summary>
      <p>闲置 <span id="idle-seconds">—</span> 秒</p>
      <p id="status" role="status" aria-live="polite">正在连接飞书文档…</p>
      <dl class="metrics">
        <div><dt>当日基线贡献次数</dt><dd id="baseline-contributions">—</dd></div>
        <div><dt>最新贡献次数</dt><dd id="latest-contributions">—</dd></div>
        <div><dt>Interaction 已保存贡献次数</dt><dd id="saved-contributions">—</dd></div>
        <div><dt>当日贡献次数 · pending</dt><dd id="live-delta">—</dd></div>
        <div><dt>当前统计日期</dt><dd id="current-date">—</dd></div>
        <div><dt>首次启用日期</dt><dd id="started-on">—</dd></div>
        <div><dt>用户本地时区</dt><dd id="timezone">—</dd></div>
      </dl>
      <h3>最近 7 个自然日</h3>
      <table><thead><tr><th>日期</th><th>贡献次数</th><th>状态</th></tr></thead><tbody id="recent-days"></tbody></table>
      <p id="contribution-rule-explanation" class="explanation"></p>
      <p class="note">最近保存检查：<span id="updated-at">—</span></p>
      <div class="contribution-rule-control">
        <p id="contribution-rule-label">一次贡献的计时规则</p>
        <div id="contribution-rules" class="contribution-rules" role="group" aria-labelledby="contribution-rule-label"></div>
      </div>
    </details>
  </main>
</body>

</html>
